version: '3.8'

services:
  # Backend API Server
  backend:
    build: ./backend
    container_name: planna-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - ./backend/db:/app/db
    depends_on:
      - ai
    networks:
      - planna-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/bookings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # AI Prediction Service
  ai:
    build: ./ai
    container_name: planna-ai
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/db:/app/db
    networks:
      - planna-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # React Frontend
  frontend:
    build: ./frontend
    container_name: planna-frontend
    ports:
      - "5000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://backend:3001
    networks:
      - planna-network

networks:
  planna-network:
    driver: bridge
